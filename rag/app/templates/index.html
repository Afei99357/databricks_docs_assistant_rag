<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Databricks Docs RAG</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><main><h1>Databricks Documentation Assistant</h1><p>Answers are grounded in the indexed official Databricks documentation.</p><form id="question-form"><textarea id="question" placeholder="Ask a Databricks question" required></textarea><button>Ask</button></form><section><p>Try one:</p><div class="starters">{% for question in starter_questions %}<button class="starter" type="button">{{ question }}</button>{% endfor %}</div></section><section id="result" hidden><h2>Answer</h2><div id="answer"></div><section id="references" hidden><h2>Official references</h2><p id="reference-summary">Retrieved excerpts supporting this answer.</p><div id="sources"></div></section><div class="feedback"><span>Was this helpful?</span><button id="up" type="button" aria-label="Helpful">👍</button><button id="down" type="button" aria-label="Not helpful">👎</button><input id="comment" maxlength="500" placeholder="Optional feedback"></div></section></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
