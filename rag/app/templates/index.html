<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Databricks Docs RAG</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><main><header class="app-header"><h1>Databricks Documentation Assistant</h1><p>Answers are grounded in the indexed official Databricks documentation.</p></header><nav class="conversation-toolbar" aria-label="Conversation actions"><button id="new-conversation" type="button">＋ New conversation</button><button id="history-toggle" type="button" aria-expanded="false">◷ History</button></nav><aside id="history-panel" hidden aria-label="Your conversations"></aside><section id="transcript" aria-live="polite"></section><form id="question-form"><textarea id="question" placeholder="Ask a Databricks question or a follow-up" required></textarea><button id="ask" type="submit">Ask</button></form><div id="loading" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span>Searching official documentation and checking the evidence…</span></div><section id="starter-section"><p>Try one:</p><div class="starters">{% for question in starter_questions %}<button class="starter" type="button">{{ question }}</button>{% endfor %}</div></section></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
