[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-docs-rag"
version = "0.1.0"
description = "Inspectable RAG over official Databricks documentation"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "databricks-sdk>=0.50",
  "faiss-cpu>=1.8",
  "Flask>=3.0",
  "gunicorn>=23.0",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
embedding = ["sentence-transformers>=3.0", "torch>=2.0"]

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.setuptools.package-data]
rag = ["ingest/config/*.yaml", "app/templates/*.html", "app/static/*.js", "app/static/*.css", "app/static/ui/**/*"]

[project.scripts]
rag = "rag.cli:main"

[tool.pytest.ini_options]
markers = ["integration: requires live external services"]

[tool.ruff]
line-length = 100
target-version = "py310"
