resources:
  jobs:
    refresh_databricks_docs_index:
      name: databricks-docs-rag-refresh-${bundle.target}
      description: Initialize RAG storage, refresh governed documentation, and publish the Databricks App FAISS snapshot.
      max_concurrent_runs: 1
      tasks:
        - task_key: refresh_and_publish
          spark_python_task:
            python_file: ../rag/jobs/refresh_app_index.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse-id
              - ${var.warehouse_id}
              - --artifact-volume
              - ${var.artifact_volume}
              - --embedding-endpoint
              - ${var.embedding_endpoint}
              - --schema-sql-path
              - ${workspace.file_path}/sql/001_rag_schema.sql
          environment_key: default
          timeout_seconds: 3600
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - .
