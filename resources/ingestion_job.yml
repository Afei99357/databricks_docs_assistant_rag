resources:
  jobs:
    refresh_databricks_docs_index:
      name: databricks-docs-rag-refresh-${bundle.target}
      description: Initialize RAG storage, refresh governed documentation, and publish the Databricks App FAISS snapshot.
      max_concurrent_runs: 1
      parameters:
        - name: repair_chunks
          default: "false"
        - name: resume_snapshot
          default: "false"
      tasks:
        - task_key: refresh_and_publish
          python_wheel_task:
            package_name: databricks_docs_rag
            entry_point: refresh_app_index
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse-id
              - ${var.warehouse_id}
              - --artifact-volume
              - ${var.artifact_volume}
              - --embedding-endpoint
              - ${var.embedding_endpoint}
              - --schema-sql-path
              - ${workspace.file_path}/sql/001_rag_schema.sql
              - --repair-chunks
              - "{{job.parameters.repair_chunks}}"
              - --resume-snapshot
              - "{{job.parameters.resume_snapshot}}"
          libraries:
            - whl: ../dist/*.whl
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            spark_conf:
              spark.master: local[*]
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              dev: ${workspace.current_user.short_name}
            data_security_mode: SINGLE_USER
          timeout_seconds: 14400
