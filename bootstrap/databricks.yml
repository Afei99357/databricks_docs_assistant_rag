bundle:
  name: databricks-docs-rag-bootstrap

include:
  - ../resources/ingestion_job.yml

artifacts:
  databricks_docs_rag:
    type: whl
    path: ..
    build: python3 -m pip wheel --no-deps --wheel-dir dist .

sync:
  paths:
    - ..
  exclude:
    - ../tmp
    - ../.env
    - ../.venv/**
    - ../data/**

variables:
  catalog:
    default: eliao
  schema:
    default: genie_kb
  artifact_volume:
    default: rag_artifacts
  warehouse_id:
    description: SQL warehouse used for bootstrap DDL and source storage.
    default: ""
  embedding_endpoint:
    default: databricks-qwen3-embedding-0-6b
  node_type_id:
    description: Classic single-node Job VM type.
    default: Standard_DS3_v2
  spark_version:
    description: Databricks Runtime version for the refresh Job cluster.
    default: 16.4.x-scala2.12

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
