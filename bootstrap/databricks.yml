bundle:
  name: databricks-docs-rag-bootstrap

include:
  - ../resources/ingestion_job.yml

sync:
  paths:
    - ..
  exclude:
    - ../tmp
    - ../.env
    - ../.venv/**
    - ../data/**

variables:
  catalog:
    default: eliao
  schema:
    default: genie_kb
  artifact_volume:
    default: rag_artifacts
  warehouse_id:
    description: SQL warehouse used for bootstrap DDL and source storage.
    default: ""
  embedding_endpoint:
    default: databricks-qwen3-embedding-0-6b

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
